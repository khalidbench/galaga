name: Leaderboard backup

# Daily backup of the team leaderboard into the repo. The store itself
# is a Google Apps Script web app (no expiry), so this is purely a
# versioned safety copy — restorable by POSTing it back to the store.
on:
  schedule:
    - cron: '0 6 * * *' # every day 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch scores and back them up
        run: |
          set -e
          API=$(jq -r .api leaderboard-config.json)
          echo "Store: $API"
          # No -f: Apps Script /exec redirects through a hop that -f treats
          # as an error, though the final response is a clean 200. The jq
          # check below is the real validation of the payload.
          DATA=$(curl -sL "$API")
          if ! echo "$DATA" | jq -e '.scores' > /dev/null 2>&1; then
            echo "Store returned invalid data — keeping previous backup" >&2
            exit 0
          fi
          echo "$DATA" | jq . > leaderboard-backup.json

      - name: Commit backup
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add leaderboard-backup.json
          git commit -m "Leaderboard backup" || exit 0
          git push
